[package]
name = "spamhaus-submission"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async client for the Spamhaus Submission Portal API"
repository = "https://github.com/chrj/rust-spamhaus-submission"
license = "MIT"
readme = "README.md"
keywords = ["spamhaus", "abuse", "spam", "security", "blocklist"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "parsing", "formatting"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
